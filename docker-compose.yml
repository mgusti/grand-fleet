services:
  # PHP-FPM Application
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    container_name: grand-fleet-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - grand-fleet
    depends_on:
      mysql:
        condition: service_healthy

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: grand-fleet-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - grand-fleet
    depends_on:
      - app

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: grand-fleet-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: grand_fleet
      MYSQL_USER: grand_fleet
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - grand-fleet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # phpMyAdmin (optional, untuk development)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: grand-fleet-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"
    networks:
      - grand-fleet
    depends_on:
      mysql:
        condition: service_healthy

networks:
  grand-fleet:
    driver: bridge

volumes:
  mysql-data:
    driver: local
